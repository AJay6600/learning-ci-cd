name: Hello World

on: [push]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello from GitHub Actions!"

      - name: Show runner info
        run: |
          echo "OS: $RUNNER_OS"
          echo "Repo: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"